services:
  api:
    build:
      context: ./backend
      target: dev
    ports:
      - "3002:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - dados:/app/data

  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  dados: