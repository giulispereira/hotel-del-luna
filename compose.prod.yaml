services:
  api:
    build:
      context: ./backend
      target: prod
    ports:
      - "3002:3001"
    env_file:
      - ./backend/.env
    volumes:
      - dados:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: prod
      args:
        - VITE_API_URL=http://localhost:3002
    ports:
      - "5173:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados: